<style>
:root{--bg:#EEF3F7;--surface:#fff;--ink:#14212B;--muted:#5B6B78;--line:#CAD5DE;--accent:#8a0303;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1520;--surface:#13202D;--ink:#E9F0F6;--muted:#93A4B2;--line:#26384A;--accent:#8a0303;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1520;--surface:#13202D;--ink:#E9F0F6;--muted:#93A4B2;--line:#26384A;--accent:#8a0303;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:1080px;margin:0 auto;padding:36px 20px 56px}
h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:0 0 32px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.card img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.card:first-child img{object-position:50% 22%}
.card:last-child img{object-position:50% 40%}
.body{padding:20px 20px 24px}
h2{font-size:1.15rem;font-weight:600;margin:0 0 16px}
.cd{display:grid;grid-template-columns:repeat(4,1fr)}
.cd div{padding-left:12px;border-left:1px solid var(--line)}
.cd div:first-child{padding-left:0;border-left:0}
.cd b{display:block;font-size:clamp(1.9rem,6vw,3rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd [data-u="s"]{color:var(--accent)}
.cd span{display:block;margin-top:6px;font-size:.88rem;color:var(--muted)}
.done{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;color:var(--accent)}
</style>

<script>
(function(){
var cards=document.querySelectorAll('[data-target]');
function p(n){return n<10?'0'+n:''+n}
function tick(){
var now=Date.now();
cards.forEach(function(c){
var diff=new Date(c.dataset.target).getTime()-now;
var cd=c.querySelector('.cd'),done=c.querySelector('.done');
if(diff<=0){cd.hidden=true;done.hidden=false;return}
cd.hidden=false;done.hidden=true;
var s=Math.floor(diff/1000);
var v={d:Math.floor(s/86400),h:p(Math.floor(s%86400/3600)),m:p(Math.floor(s%3600/60)),s:p(s%60)};
for(var k in v)c.querySelector('[data-u="'+k+'"]').textContent=v[k];
});
}
tick();setInterval(tick,1000);
})();
